# A generic, single database configuration.

[alembic]
# path to migration script directory
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepends = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters which will be used to create the slug
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a corresponding .py file to be detected as revisions
# sourceless = false

# version location specification; this defaults to alembic/versions.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# set to 'true' to search source files recursively for revisions
# recursive_version_locations = false

# output encoding used when --template is written
# output_encoding = utf-8

sqlalchemy.url = postgresql://ats:ats@localhost:5432/ats

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
